<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>流光/光晕同步开关测试</title>
<style>
  :root { --jc-beam-duration: 2s; }
  @keyframes jc-beam-move { from { offset-distance: 0%; } to { offset-distance: 100%; } }

  .stage { display: flex; gap: 40px; padding: 40px; font-family: sans-serif; }
  .host { position: relative; width: 300px; height: 60px; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
  .beam, .glow { position: absolute; inset: 0; }
  .beam__fx, .glow__fx { position: absolute; inset: 0; width: 100px; height: 100%; offset-path: rect(0 auto auto 0 round 4px); offset-rotate: auto; offset-anchor: 90% 50%; animation: jc-beam-move var(--jc-beam-duration) linear infinite; }
  .glow__fx { filter: blur(6px); }
  .label { font-size: 13px; margin-bottom: 8px; }
  .tag { font-size: 11px; color: #666; margin-top: 6px; }
  /* 方案 A（旧，有 bug）：display:none 隐藏光晕 */
  .a-off .glow-a { display: none !important; }
  /* 方案 B（修复）：visibility:hidden 隐藏光晕 */
  .b-off .glow-b { visibility: hidden !important; }
</style>
</head>
<body>
  <div class="stage">
    <div>
      <div class="label">方案 A · display:none 开关（旧）</div>
      <div class="host" id="hostA">
        <div class="beam"><div class="beam__fx" id="a-beam"></div></div>
        <div class="glow glow-a"><div class="glow__fx" id="a-glow"></div></div>
      </div>
      <div class="tag" id="tagA"></div>
    </div>
    <div>
      <div class="label">方案 B · visibility:hidden 开关（修复）</div>
      <div class="host" id="hostB">
        <div class="beam"><div class="beam__fx" id="b-beam"></div></div>
        <div class="glow glow-b"><div class="glow__fx" id="b-glow"></div></div>
      </div>
      <div class="tag" id="tagB"></div>
    </div>
  </div>
</body>
</html>
