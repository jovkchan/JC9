name: Release

# 完整打包（生成各平台安装程序）：
# - 手动触发：GitHub → Actions → Release → Run workflow（推荐，无需打 tag）
#   构建产物会以 Artifact 形式保存，可在本次运行结果页直接下载
# - 或推送 v* 标签：git tag v1.0.1 && git push --tags
#   构建产物同时上传到该 tag 的 GitHub Release（Draft 草稿）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
          # macOS 拆两个 job：分别打 Apple Silicon (ARM) 与 Intel (x86_64) 包
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux 系统依赖（Tauri v2：webkit2gtk / gtk / svg / appindicator / xdg-utils）──
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential

      # ── Node.js（有 package-lock.json → npm ci 稳定复现）──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # ── Rust 工具链 + 缓存（macOS 额外加两个交叉编译 target）──
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 仅在 macOS runner 上安装两个 darwin target（aarch64 + x86_64）
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── 完整打包（tauri build：npm run build + cargo release + 生成安装包）──
      # 项目根在仓库根（package.json + src-tauri/tauri.conf.json），因此不设 projectPath。
      # 推送 v* 标签时上传到该 tag 的 GitHub Release；手动触发时仅构建（供下方 Artifact 下载）。
      - name: Build & bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'JC9 v__VERSION__' || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && 'JC9 自动构建产物（GitHub Actions）。' || '' }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
