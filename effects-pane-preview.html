<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>动画效果面板布局预览</title>
<style>
  :root {
    --jc-bg-app: #0d1117; --jc-bg-panel: #161b22; --jc-bg-elevated: #1c2128;
    --jc-bg-hover: #21262d; --jc-bg-selected: rgba(88,166,255,0.12);
    --jc-border-default: #30363d; --jc-color-accent: #58a6ff;
    --jc-text-primary: #e6edf3; --jc-text-secondary: #8b949e; --jc-text-highlight: #f0f6fc;
    --jc-color-success: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--jc-bg-app); color: var(--jc-text-primary); }
  .settings-body { display: flex; height: 100vh; }
  .settings-nav { width: 140px; background: var(--jc-bg-panel); border-right: 1px solid var(--jc-border-default); padding: 8px 0; font-size: 12px; color: var(--jc-text-secondary); }
  .nav-item { padding: 7px 14px; cursor: pointer; }
  .nav-item.active { background: var(--jc-bg-selected); color: var(--jc-color-accent); font-weight: 600; }
  .settings-content { flex: 1; padding: 12px 16px; overflow-y: auto; }
  .settings-pane { display: flex; flex-direction: column; gap: 10px; }

  /* === 复制的效果面板样式 === */
  .effects-pane { max-width: 900px; width: 100%; margin: 0 auto; }
  .pane-title { font-size: 13px; font-weight: 600; color: var(--jc-text-highlight); border-bottom: 1px solid var(--jc-border-default); padding-bottom: 6px; margin: 0; }
  .pane-desc { font-size: 11px; color: var(--jc-text-secondary); line-height: 1.6; margin: 0; }
  .effects-card { display: flex; flex-direction: column; gap: 10px; background: var(--jc-bg-elevated); border: 1px solid var(--jc-border-default); border-radius: 8px; padding: 12px 14px; }
  .effects-card-title { font-size: 11px; font-weight: 600; color: var(--jc-text-highlight); }
  .effects-preview-card { background: var(--jc-bg-elevated); border: 1px solid var(--jc-border-default); border-radius: 8px; padding: 12px 14px; }
  .effects-preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .span-2 { grid-column: span 2; }
  .effects-preview-hint { font-size: 10px; color: var(--jc-text-secondary); opacity: 0.8; margin-top: 8px; }

  .form-group { display: flex; flex-direction: column; gap: 3px; }
  .form-group label { font-size: 11px; font-weight: 500; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 11px; font-weight: 500; cursor: pointer; }
  .toggle-switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .toggle-slider { position: absolute; inset: 0; background: #30363d; border-radius: 20px; }
  .toggle-slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; }
  .help-text { font-size: 10px; color: var(--jc-text-secondary); opacity: 0.8; }
  .effect-range { width: 100%; accent-color: var(--jc-color-accent); }
  .effect-chips { display: flex; gap: 6px; }
  .effect-chip { padding: 4px 10px; font-size: 11px; border: 1px solid var(--jc-border-default); border-radius: 4px; color: var(--jc-text-secondary); cursor: pointer; }
  .effect-chip.active { background: rgba(88,166,255,0.1); border-color: var(--jc-color-accent); color: var(--jc-color-accent); }
  .effect-color-row { display: flex; align-items: center; gap: 8px; }
  .effect-color-picker { width: 34px; height: 24px; padding: 0; border: 1px solid var(--jc-border-default); border-radius: 4px; background: transparent; }
  .effect-color-percent { font-size: 11px; color: var(--jc-text-secondary); width: 44px; text-align: right; }
  .effect-color-actions { display: flex; gap: 6px; }
  .btn-sm { padding: 2px 8px; border: 1px solid var(--jc-border-default); border-radius: 4px; font-size: 10px; cursor: pointer; background: var(--jc-bg-elevated); color: var(--jc-text-primary); }
  /* 模拟 JC 组件 */
  .jc-preview { display: block; width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--jc-text-primary); }
  .jc-preview-area { grid-column: span 2; resize: vertical; height: 52px; }
</style>
</head>
<body>
  <div class="settings-body">
    <aside class="settings-nav">
      <div class="nav-item">通用设置</div>
      <div class="nav-item active">动画效果</div>
      <div class="nav-item">模型配置</div>
      <div class="nav-item">智能体</div>
    </aside>
    <main class="settings-content">
      <div class="settings-pane effects-pane">
        <h3 class="pane-title">动画效果</h3>
        <p class="pane-desc">全局动态配置流光/光晕效果，实时生效并保存到 DATA 目录 effect-config.json。组件实例显式传参（beam-color / beam-duration 等）仍优先于全局值。</p>

        <div class="effects-preview-card">
          <div class="effects-card-title">🎬 效果预览（实时）</div>
          <div class="effects-preview-grid">
            <input class="jc-preview" placeholder="输入框 · 聚焦查看" />
            <input class="jc-preview" placeholder="选择器 · 聚焦查看" />
            <textarea class="jc-preview jc-preview-area" placeholder="多行文本 · 聚焦查看"></textarea>
          </div>
          <div class="effects-preview-hint">聚焦任一组件即可查看边框流光 + 内部光晕</div>
        </div>

        <div class="effects-card">
          <div class="form-group"><label class="toggle-row"><span>流光效果</span><span class="toggle-switch"><span class="toggle-slider"></span></span></label><span class="help-text">总开关：关闭后所有组件的边框流光（及光晕）隐藏</span></div>
          <div class="form-group"><label class="toggle-row"><span>内部光晕</span><span class="toggle-switch"><span class="toggle-slider"></span></span></label><span class="help-text">流光基础上叠加的内侧泛光</span></div>
          <div class="form-group"><label>启用组件</label><div class="effect-chips"><span class="effect-chip active">输入框</span><span class="effect-chip active">多行文本</span><span class="effect-chip active">选择器</span></div></div>
          <div class="form-group"><label>光束速度：90 px/s</label><input type="range" class="effect-range" min="20" max="300" step="5" value="90" /><span class="help-text">统一线速度：每个组件按自身周长计算圈时长（= 周长 ÷ 速度），大小组件移动速度一致</span></div>
          <div class="form-group"><label class="toggle-row"><span>拐角变速</span><span class="toggle-switch"><span class="toggle-slider"></span></span></label></div>
          <div class="form-group"><label>光晕大小（模糊）：6px</label><input type="range" class="effect-range" min="0" max="20" step="1" value="6" /></div>
          <div class="form-group"><label>光晕透明度：65%</label><input type="range" class="effect-range" min="0" max="1" step="0.05" value="0.65" /></div>
          <div class="form-group"><label>全局渐变颜色（流光/光晕共用，可添加 / 删除 / 调停靠点）</label>
            <div class="effect-color-row"><input type="color" class="effect-color-picker" value="#5b7cff" /><input type="range" class="effect-range" value="0" /><span class="effect-color-percent">0%</span><button class="btn-sm">✕</button></div>
            <div class="effect-color-row"><input type="color" class="effect-color-picker" value="#8a58ff" /><input type="range" class="effect-range" value="40" /><span class="effect-color-percent">40%</span><button class="btn-sm">✕</button></div>
            <div class="effect-color-row"><input type="color" class="effect-color-picker" value="#a878ff" /><input type="range" class="effect-range" value="68" /><span class="effect-color-percent">68%</span><button class="btn-sm">✕</button></div>
            <div class="effect-color-actions"><button class="btn-sm">+ 添加颜色</button><button class="btn-sm">恢复默认</button></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
